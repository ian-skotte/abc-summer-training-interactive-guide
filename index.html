<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC Summer Training — Day 1 Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F4F1;
    --panel:#FFFFFF;
    --ink:#1B2432;
    --ink-soft:#5B6472;
    --line:#D8DBD6;
    --navy:#1B2A4A; --navy-soft:#E7EAF1;
    --teal:#1E5C55; --teal-soft:#E1EDEA;
    --amber:#8A5A15; --amber-soft:#F3E7D2;
    --plum:#5B3A66; --plum-soft:#EEE3F0;
    --focus:#C89B3C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Source Serif 4',Georgia,serif;font-weight:600;margin:0;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:#C89B3C55;}

  /* Skip link / focus */
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .rail{
    width:280px;flex:0 0 280px;
    background:var(--navy);
    color:#EDEFF4;
    padding:24px 18px 24px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .rail-title{
    font-size:1.05rem;line-height:1.3;color:#fff;margin-bottom:2px;
  }
  .rail-sub{
    font-size:.78rem;color:#B7C0D6;margin-bottom:22px;
  }
  .mode-toggle{
    display:flex;gap:6px;margin-bottom:20px;
    background:#141F38;border:1px solid #2C3A5B;border-radius:8px;padding:4px;
  }
  .mode-toggle button{
    flex:1;background:transparent;border:none;color:#B7C0D6;
    padding:8px 6px;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:600;
    transition:background .15s,color .15s;
  }
  .mode-toggle button.active{background:#EDEFF4;color:var(--navy);}
  .search-wrap{margin-bottom:18px;}
  .search-wrap input{
    width:100%;padding:9px 10px;border-radius:6px;border:1px solid #2C3A5B;
    background:#141F38;color:#EDEFF4;font-size:.85rem;
  }
  .search-wrap input::placeholder{color:#7E8BA8;}
  .nav-list{list-style:none;margin:0;padding:0;}
  .nav-list li{margin-bottom:2px;}
  .nav-btn{
    width:100%;text-align:left;background:transparent;border:none;color:#D7DCEA;
    padding:9px 10px;border-radius:6px;cursor:pointer;font-size:.85rem;
    display:flex;align-items:center;gap:9px;
  }
  .nav-btn:hover{background:#26335A;}
  .nav-btn.active{background:#EDEFF4;color:var(--navy);font-weight:600;}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;}
  .rail-foot{margin-top:22px;padding-top:14px;border-top:1px solid #2C3A5B;font-size:.72rem;color:#8290AC;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:38px 44px 80px;max-width:920px;}
  .top-search-results{margin-bottom:26px;}
  .top-search-results h2{font-size:1.2rem;margin-bottom:14px;}
  .section-header{margin-bottom:22px;}
  .section-eyebrow{
    display:inline-block;font-size:.78rem;color:var(--ink-soft);margin-bottom:6px;
  }
  .section-header h2{font-size:1.7rem;letter-spacing:-.01em;}
  .presenters{font-size:.85rem;color:var(--ink-soft);margin-top:6px;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left-width:4px;
    padding:16px 18px;margin-bottom:12px;border-radius:2px;
  }
  .card h3{font-size:1rem;margin-bottom:6px;}
  .card p{margin:0;font-size:.93rem;color:#333c48;}
  .card .badge{
    display:inline-block;font-size:.72rem;font-weight:600;
    padding:2px 8px;border-radius:20px;margin-bottom:8px;
  }

  .empty-state{
    padding:40px 0;color:var(--ink-soft);font-size:.95rem;
  }

  /* ---------- Quiz ---------- */
  .quiz-picker{margin-bottom:22px;display:flex;flex-wrap:wrap;gap:8px;}
  .quiz-picker button{
    border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:20px;
    font-size:.82rem;cursor:pointer;color:var(--ink);
  }
  .quiz-picker button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .quiz-card{
    background:var(--panel);border:1px solid var(--line);padding:28px 30px;
    max-width:640px;
  }
  .quiz-progress{font-size:.8rem;color:var(--ink-soft);margin-bottom:10px;}
  .quiz-q{font-size:1.15rem;margin-bottom:18px;line-height:1.4;}
  .quiz-choices{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .quiz-choice{
    text-align:left;border:1px solid var(--line);background:#fff;padding:11px 14px;
    border-radius:6px;cursor:pointer;font-size:.92rem;color:var(--ink);
  }
  .quiz-choice:hover{border-color:#9aa3b0;}
  .quiz-choice.correct{border-color:#1E5C55;background:var(--teal-soft);}
  .quiz-choice.incorrect{border-color:#9C3B2E;background:#F6E4E0;}
  .quiz-choice[disabled]{cursor:default;}
  .quiz-explain{
    font-size:.88rem;background:var(--navy-soft);border-radius:6px;padding:12px 14px;
    margin-bottom:18px;display:none;
  }
  .quiz-explain.show{display:block;}
  .quiz-actions{display:flex;justify-content:space-between;align-items:center;}
  .quiz-next{
    background:var(--navy);color:#fff;border:none;padding:9px 18px;border-radius:6px;
    cursor:pointer;font-size:.88rem;font-weight:600;
  }
  .quiz-next[disabled]{opacity:.4;cursor:default;}
  .quiz-score{font-size:.85rem;color:var(--ink-soft);}
  .quiz-done{background:var(--panel);border:1px solid var(--line);padding:34px 30px;max-width:640px;}
  .quiz-done h3{font-size:1.3rem;margin-bottom:8px;}
  .restart-btn{
    margin-top:14px;background:transparent;border:1px solid var(--navy);color:var(--navy);
    padding:9px 16px;border-radius:6px;cursor:pointer;font-size:.87rem;font-weight:600;
  }

  @media (max-width:760px){
    .app{flex-direction:column;}
    .rail{width:100%;flex:none;position:relative;height:auto;}
    .main{padding:26px 20px 60px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Training sections">
    <div class="rail-title">ABC Summer Training</div>
    <div class="rail-sub">Day 1 field guide — State &amp; Higher Ed</div>

    <div class="mode-toggle" role="tablist">
      <button id="btn-mode-reference" class="active" role="tab" aria-selected="true">Reference</button>
      <button id="btn-mode-quiz" role="tab" aria-selected="false">Quiz</button>
    </div>

    <div class="search-wrap" id="search-wrap">
      <input type="text" id="search-input" placeholder="Search topics, deadlines, rules…" aria-label="Search reference guide">
    </div>

    <ul class="nav-list" id="nav-list"></ul>

    <div class="rail-foot">Built from the first day of the annual ABC summer training. For State &amp; Higher Ed agency benefits coordinators.</div>
  </nav>

  <main class="main" id="main"></main>
</div>

<script>
const SECTIONS = [
  {
    id:'compliance', label:'Financial Stewardship & Compliance', color:'navy',
    presenters:'Jennifer Gorley, Rachel Hansborough, Joshua Burns, Chanda Rainey, Teresa Liles',
    facts:[
      {t:'PPACA minimum value', b:'The Affordable Care Act (enacted March 2010) requires employers to offer coverage that is affordable and covers at least 60% of the total allowed cost of benefits for full-time employees. AON Consulting performs this minimum-value analysis for BA every year.'},
      {t:'OPEB (Other Post-Employment Benefits)', b:'Retiree health insurance is the most common OPEB. The state-administered plan is currently the only one subject to GASB financial reporting requirements, which BA meets through annual AON Consulting valuation reports.'},
      {t:'CAA prescription drug reporting', b:'Under the Consolidated Appropriations Act of 2021, BA submits an annual report to CMS — in partnership with the PBM and TPAs — covering top drug spend, most-prescribed drugs, manufacturer rebates, and member cost sharing.'},
      {t:'HIPAA — who\u2019s who', b:'Health plans, clearinghouses, and providers doing electronic transactions are "covered entities" (BA is the covered entity). A business associate is anyone outside the covered entity who handles PHI on its behalf — that\u2019s ABCs. Business associates are directly liable for HIPAA compliance, not just the covered entity.'},
      {t:'BART (Benefits Administration Review Team)', b:'Reviews appeals about enrollment, benefit election changes, and coverage termination. BART cannot approve anything that conflicts with the plan document, and it does not review denied medical claims — those go to the carrier\u2019s appeals process.'},
      {t:'New Employee Checklist matters in appeals', b:'This is the document BART leans on most in disputed cases (e.g., "I was never told the deadline"). It must be signed and dated by the employee — without it, a dispute becomes "he said, she said."'},
    ],
    quiz:[
      {q:'Under PPACA, what percentage of total allowed benefit cost must a plan cover to meet the "minimum value" standard?',
       choices:['50%','60%','70%','80%'], a:1,
       ex:'PPACA\u2019s employer shared responsibility provision sets minimum value at covering at least 60% of total allowed cost — AON Consulting verifies this for BA annually.'},
      {q:'Which statement about ABCs and HIPAA is true?',
       choices:['ABCs are covered entities under HIPAA','ABCs are business associates and are directly liable for HIPAA compliance','Only BA can be held liable for a HIPAA violation','HIPAA only applies to healthcare providers'], a:1,
       ex:'BA is the covered entity; ABCs are business associates who handle PHI on BA\u2019s behalf, and business associates are directly, independently liable for compliance.'},
    ]
  },
  {
    id:'changes2027', label:'2027 Plan Year Changes', color:'amber',
    presenters:'Alicia Johnson',
    facts:[
      {t:'Member cost share holds steady', b:'Copays, deductibles, and coinsurance are unchanged for 2027 — the one exception is the CDHP minimum deductible, which the IRS requires to rise: +$50 for employee-only, +$100 for all other tiers.'},
      {t:'No change to GLP-1 coverage', b:'Weight-loss GLP-1 coverage and member cost share are staying exactly the same in 2027.'},
      {t:'Only one carrier change', b:'No carrier changes anywhere in the program except the Tennessee Plan, which moves from UMR to Blue Cross Blue Shield effective January 1, 2027.'},
      {t:'Dental, vision, voluntary rates flat', b:'Dental, vision, and all other voluntary product rates are not changing for 2027.'},
      {t:'State plan aggregate increase', b:'The state medical plan has an average (aggregate) rate increase of 7.9% for 2027.'},
    ],
    quiz:[
      {q:'Which carrier change is happening for the 2027 plan year?',
       choices:['Blue Cross is leaving the state plan','The Tennessee Plan moves from UMR to Blue Cross Blue Shield','Cigna is being added as a brand-new carrier','All plans are consolidating to one carrier'], a:1,
       ex:'The Tennessee Plan (the Medicare supplement) changes its claims administrator from UMR to Blue Cross Blue Shield effective 1/1/2027.'},
      {q:'What is actually increasing for members in 2027?',
       choices:['Copays','Coinsurance percentages','The CDHP minimum deductible (IRS-mandated)','GLP-1 cost share'], a:2,
       ex:'The IRS sets the CDHP minimum deductible floor, so it must rise — $50 for employee-only, $100 for all other tiers. Everything else in cost share stays flat.'},
    ]
  },
  {
    id:'onboarding', label:'New Hire Onboarding', color:'navy',
    presenters:'Tamara Scott',
    facts:[
      {t:'The 30-day clock', b:'New hires have 30 days to make elections, counted from the hire date or eligibility date — not the day after, which is the rule for mid-year special enrollments.'},
      {t:'10-day dependent doc extension', b:'A separate 10 calendar-day extension exists only for submitting missing dependent verification documents, on top of the 30-day election window.'},
      {t:'What happens if deadlines are missed', b:'No election within 30 days = coverage waived for the rest of the plan year. No dependent documentation within 40 days (30+10) = that dependent\u2019s coverage is waived for the rest of the year.'},
      {t:'Two enrollment paths', b:'Benefit e-Form: the ABC enters elections and uploads dependent docs directly in Edison. Employee Self-Service: the employee submits the Formstack application and uploads their own documentation in Edison.'},
      {t:'Coverage effective dates', b:'Hired on the 1st of the month → coverage begins the 1st of the following month. Hired any other day → must satisfy one full calendar month first, so coverage begins the 1st of the month after that (e.g., hired July 2 → full month is August → coverage begins September 1).'},
      {t:'Higher ed-to-higher ed moves: e-hire indicators', b:'Even if Edison shows "rehire," an employee moving from one participating higher ed agency to another is treated as a new hire. Check the e-hire color: green = still active elsewhere, proceed normally. Yellow = terminated record — check the termination date; if it\u2019s after your agency\u2019s hire date, notify BA via Zendesk to set up a new employee instance.'},
      {t:'New Hire Checklist', b:'Required at every initial enrollment — new hire, rehire, or status change. Employee and ABC both sign; give the employee a copy and keep the original in the personnel file.'},
    ],
    quiz:[
      {q:'A new hire starts on July 2 and enrolls on time. When does coverage begin?',
       choices:['July 1','August 1','September 1','October 1'], a:2,
       ex:'The employee must satisfy one full calendar month first — July doesn\u2019t count since they weren\u2019t hired on the 1st, so August is the qualifying full month and coverage starts September 1.'},
      {q:'What does a yellow e-hire indicator mean when onboarding a higher-ed transfer?',
       choices:['The employee is still active with the prior agency','The employee has a terminated record — check the termination date','The employee has never had an Edison record','The enrollment was auto-approved'], a:1,
       ex:'Yellow flags a terminated record. If that termination date falls after your agency\u2019s hire date, notify BA to create a new employee instance.'},
    ]
  },
  {
    id:'sqe', label:'Special Qualifying Events', color:'navy',
    presenters:'Paula Vetter',
    facts:[
      {t:'The 4-step ABC workflow', b:'1) Gather info from the member (what dependents, what documentation is needed, deadlines) — send a follow-up email listing everything required. 2) Review the submission for completeness. 3) Submit right away via the SQE Benefit e-Form or Formstack, even if documentation is still missing — this locks in the enrollment date. 4) BA reviews within 2–5 business days.'},
      {t:'Three SQE types', b:'Gaining a new dependent (marriage, birth, adoption, placement for adoption, legal guardianship); loss of other group health coverage; newly eligible for Medicaid/CHIP premium assistance.'},
      {t:'New spouse name on record', b:'A new spouse is enrolled under the name on the marriage certificate, not a new legal name, until a Social Security card is provided showing the name change.'},
      {t:'Newborn without an SSN', b:'Enroll using all 9s. The member then has 90 days to provide the real SSN. If it\u2019s not available in time, BA needs monthly documentation of a genuine good-faith effort to obtain it (e.g., attorney correspondence, SSA communication) — a bare attestation isn\u2019t enough.'},
      {t:'Loss of coverage — what "proof" means', b:'Must show coverage existed at the last time the employee had the chance to enroll and declined (not necessarily their most recent job) — including participant name, coverage type, dates, and the reason coverage ended.'},
      {t:'Voluntary cancellation doesn\u2019t count', b:'Voluntarily canceling TennCare because you expect to lose eligibility is NOT a qualifying event. TennCare determining you\u2019re no longer eligible IS a qualifying event.'},
      {t:'Whose dependents can enroll', b:'If the employee loses coverage, the employee and any eligible dependent may enroll. If only a dependent loses coverage, only the employee and that specific dependent may enroll — not other dependents.'},
      {t:'Proof of joint ownership (married 12+ months)', b:'Required in addition to the marriage certificate: a bank, mortgage, or credit card statement from the last 6 months with both names; a residential lease within its current term (not month-to-month); a property tax statement from the last 12 months; or a joint federal tax return. Utility bills, driver\u2019s licenses, insurance cards, and plain mail are NOT accepted.'},
      {t:'Medicaid/CHIP premium assistance', b:'Enrollment request due within 60 days of the eligibility notice, with documentation from Medicaid/CHIP proving qualification.'},
      {t:'Effective dates', b:'Birth/adoption/placement received within 30 days → medical is retroactive to the event date, dental/vision start the 1st of the following month. Received days 31–60 → everything starts the 1st of the following month. All other SQEs: coverage starts the 1st of the month after every required document is received, with a hard 60-day deadline.'},
      {t:'10-day dependent grace period — the fine print', b:'Only protects the original effective date if the enrollment request AND every other required piece of SQE documentation were submitted on time, and only dependent verification is outstanding. It does NOT extend the deadline for missing SQE documentation itself (e.g., a late marriage certificate for a loss-of-coverage claim pushes the effective date out).'},
      {t:'Avoiding processing delays', b:'Most common causes: using the wrong form, missing/incomplete documentation, waiting to submit while collecting documents (submit immediately — it locks in the date), and assuming submission alone sets the effective date (it doesn\u2019t — all documentation must be received first).'},
    ],
    quiz:[
      {q:'An employee voluntarily cancels TennCare because they know they\u2019ll lose eligibility, then tries to enroll as a loss-of-coverage SQE. Does this qualify?',
       choices:['Yes, any loss of TennCare qualifies','No — voluntary cancellation isn\u2019t a qualifying loss','Yes, if documented within 10 days','No, TennCare loss never qualifies'], a:1,
       ex:'Voluntary cancellation doesn\u2019t count. If TennCare itself determines the person is no longer eligible, that DOES qualify.'},
      {q:'Which of these is NOT accepted as proof of joint ownership?',
       choices:['A joint bank statement from the last 6 months','A joint mortgage statement','A driver\u2019s license','A residential lease within its current term'], a:2,
       ex:'Driver\u2019s licenses, insurance cards, and utility bills are all rejected — they don\u2019t establish joint financial or residential ownership.'},
      {q:'The 10-day dependent documentation grace period keeps the original effective date only when:',
       choices:['Any document is late, as long as it\u2019s within 10 days','Only the dependent verification is outstanding — everything else was submitted on time','The employee pays a late fee','It applies automatically to every SQE type'], a:1,
       ex:'If any other required SQE documentation (like a proof-of-loss letter) is also missing, the grace period doesn\u2019t apply and the effective date pushes out.'},
    ]
  },
  {
    id:'medical', label:'Medical Plans & Networks', color:'teal',
    presenters:'Andrea Dowdy',
    facts:[
      {t:'Three plan designs, two carriers', b:'Premier PPO, Standard PPO, or the State CDHP with an HSA — each offered through either Blue Cross Blue Shield or Cigna. Premiums, member cost share, and benefit programs (Hinge Health, telehealth, fitness discounts) are identical regardless of which carrier a member picks.'},
      {t:'Network choice is what actually moves cost', b:'Efficient networks (BCBS Network S, Cigna Local Plus) have lower negotiated provider rates, so members pay less in premiums, deductibles, and coinsurance. Expanded networks (BCBS Network P, Cigna Open Access Plus) cost providers — and therefore members — more across the board.'},
      {t:'Worked example: an ER visit', b:'On an efficient network, a $1,500 allowed ER charge at 20% coinsurance costs the member $300. On the expanded network, the same visit might be allowed at $2,000, costing the member $400 — same hospital, same service, more expensive network.'},
      {t:'Emergency care is always in-network', b:'Regardless of network choice, emergency care at any hospital is covered in-network. Some specific hospitals (e.g., HCA TriStar, Baptist Memphis) are out-of-network on the efficient networks for non-emergency care — check the all-network hospital list on Partners for Health before enrolling if a member has a hospital preference.'},
      {t:'Carrum Health Centers of Excellence', b:'Covers surgical services and, new this year, cancer care (chemo/radiation) with Tennessee Oncology. Starting in 2027, weight-loss surgery will ONLY be covered through Carrum Health COE — nowhere else. No member cost on PPO plans; CDHP members pay nothing after meeting the federal minimum deductible.'},
      {t:'BA vs. the carriers — who does what', b:'BA designs and implements the plans, manages carrier contracts, funds claims with premium dollars, and handles eligibility/enrollment support and appeals. The carriers determine medical necessity, maintain provider networks, process claims, and handle benefit-level appeals.'},
    ],
    quiz:[
      {q:'What\u2019s the real practical difference between "efficient" and "expanded" networks?',
       choices:['Efficient networks only cover emergencies','Expanded networks negotiate lower rates','Efficient networks have lower negotiated provider rates, so members pay less','There\u2019s no cost difference'], a:2,
       ex:'Efficient-network providers agree to lower rates, which flows through to lower member premiums, deductibles, and coinsurance.'},
      {q:'Starting in 2027, where must weight-loss surgery be performed to be covered?',
       choices:['Any in-network hospital','Only through Carrum Health Centers of Excellence','Only at HCA TriStar facilities','It won\u2019t be covered anywhere'], a:1,
       ex:'2027 is a hard change — weight-loss surgery performed anywhere outside Carrum Health COE will not be covered.'},
    ]
  },
  {
    id:'disability', label:'Disability Benefits (2027 changes)', color:'amber',
    presenters:'Zac Colona',
    facts:[
      {t:'STD consolidates to one plan', b:'Current STD A and STD B merge into a single employee-paid plan modeled on today\u2019s STD A: 60% of salary weekly, max $2,500/week, min $25/week, 14-day elimination period. Current enrollees move automatically.'},
      {t:'STD: what\u2019s new', b:'Maximum benefit period becomes 13 weeks, and the conversion option is eliminated. New premium: $0.20 per $100 of covered monthly salary (down from $0.41 or $0.33 today).'},
      {t:'LTD consolidates to one plan', b:'Contributory options 1, 2, and 4 and today\u2019s employer-paid option 3 all merge into one employer-paid plan, modeled on today\u2019s option 3: 63% of salary weekly, 90-day elimination period, max $10,000/month, minimum benefit is the greater of 10% or $100/month.'},
      {t:'LTD: what\u2019s new', b:'The cost-of-living adjustment and the conversion option are both eliminated. New rate: $0.113 per $100 of covered monthly salary (down from $0.278) — still 100% state-paid, no employee cost.'},
      {t:'Enrollment mechanics', b:'STD is guaranteed issue only during a new hire\u2019s initial eligibility window; late applicants need evidence of insurability. LTD is automatic for every eligible employee — no health questions, and it can\u2019t be waived.'},
      {t:'Current claimants', b:'Anyone already on an STD or LTD claim stays on their existing plan until they return to work, then moves into the new consolidated plan.'},
    ],
    quiz:[
      {q:'What\u2019s changing about who pays LTD premiums in 2027?',
       choices:['Employees start paying a share','It stays fully state-paid, just at a lower rate','LTD becomes fully optional','Premiums double'], a:1,
       ex:'LTD remains 100% employer-paid — the rate is dropping from $0.278 to $0.113 per $100 of covered salary.'},
      {q:'What feature is being eliminated from both the new STD and LTD plans?',
       choices:['Elimination periods','The conversion option','Guaranteed issue for new hires','State funding'], a:1,
       ex:'Both plans drop their conversion options; LTD also drops its cost-of-living adjustment.'},
    ]
  },
  {
    id:'pharmacy', label:'Pharmacy & FSA/HSA', color:'teal',
    presenters:'Missy Tucker, Adam Elkins',
    facts:[
      {t:'CDHP + HSA seed funding', b:'Enrolling in the CDHP automatically opens an HSA, with the state paying the account fee. Active employees (not retirees) get seed funding at the start of the year: $500 employee-only or $1,000 family.'},
      {t:'HSA tax treatment', b:'Contributions and withdrawals for qualified medical expenses are tax-free, and unused funds roll over and can eventually be invested. After age 65, non-medical withdrawals are taxed but not penalized; under 65, they\u2019re both taxed and hit with a 20% penalty.'},
      {t:'2027 HSA contribution limits', b:'$4,500 employee-only (up $100), $9,000 for all family tiers — including employer contributions. Members 55+ can add another $1,000/year.'},
      {t:'CDHP preventive drug list', b:'Maintenance medications on the IRS-approved CDHP preventive drug list (diabetes, heart conditions, COPD, asthma, etc.) get 10% coinsurance before the deductible is met, instead of full price.'},
      {t:'Three FSA types, three sets of rules', b:'Medical FSA: 2027 max $3,400, partial carryover. Limited Purpose FSA (for CDHP enrollees, vision/dental only): 2027 max $3,400, up to $680 carryover — but a carryover balance must be used by the end of the following plan year or it\u2019s forfeited. Dependent Care FSA: 2027 max $7,500, NO carryover, funds only available as they\u2019re payroll-deducted, and claims can\u2019t be filed for future dates.'},
      {t:'FSA eligibility & re-enrollment', b:'Enrollment isn\u2019t automatic — re-enroll every year during annual enrollment. Retirees, part-time employees, and higher-ed retirees are not eligible for any FSA.'},
      {t:'The 90-day rule', b:'After termination, employees have 90 days to submit FSA claims for expenses incurred on or before their termination date; anything unused after that is forfeited. Medical and Limited Purpose FSAs can continue under COBRA — Dependent Care FSA cannot.'},
      {t:'CVS Caremark plan microsite', b:'Formerly called the "splash page." Hosts the formulary guidebook (updated quarterly), a member portal with real-time drug cost and claims lookup, and prior-authorization criteria.'},
      {t:'Zepbound returns October 2026', b:'Coming back to the formulary with a prior authorization, quantity limits, and the standard 25% GLP-1 member cost share.'},
    ],
    quiz:[
      {q:'Which FSA type allows NO carryover of unused funds?',
       choices:['Medical FSA','Limited Purpose FSA','Dependent Care FSA','All FSAs allow full carryover'], a:2,

       choices:['Investment performance of the employee\u2019s own contributions','A set formula: accrual factor × average final compensation × years of service','The balance shown in the employee\u2019s TCRS account','A flat dollar amount for all retirees'], a:1,
       ex:'TCRS is a defined-benefit plan — it\u2019s pure math, not investment performance, and the visible account balance doesn\u2019t equal the eventual benefit.'},
      {q:'If an employee updates their beneficiary in Edison, what else do they need to do?',
       choices:['Nothing — Edison updates everything','Separately update beneficiaries in TCRS and their 401(k)/457 accounts','Only update every 5 years','Call Empower by phone only'], a:1,

      {t:'Retros don\u2019t show where you\u2019d expect', b:'Retros load right before payroll confirms, so they never appear on the Premiums Due Report. Give it one full billing period on the Collections Applied Report; if a retro still hasn\u2019t shown up after that, submit a Zendesk ticket.'},
    ],
    quiz:[
      {q:'What does the Collections Applied Report represent?',
       choices:['The anticipated bill, which can still change','The confirmed bill, drafted on the 15th','A quarterly summary','A retiree-only report'], a:1,
       ex:'It\u2019s locked in on the first working day of the month and is the actual amount drafted on the 15th.'},
      {q:'A retro hasn\u2019t appeared after one full billing period. What should the ABC do?',
       choices:['Wait three more months','Submit a Zendesk ticket to BA','Call the carrier directly','Nothing — it resolves automatically'], a:1,
       ex:'One billing cycle is the expected wait; beyond that, escalate through Zendesk.'},

  },

    id:'comms', label:'Communications & Annual Enrollment', color:'amber',
    presenters:'Crystal Mallery',

      {q:'What are the 2026 Annual Enrollment dates for State and Higher Education?',
       choices:['October 1–30','October 1–16','September 1–30','October 15–31'], a:1,

      {q:'What happens if a member unsubscribes from one Partners for Health email?',
       choices:['Only that specific campaign stops','They unsubscribe from ALL Partners for Health emails','Nothing changes','They\u2019re auto-resubscribed after 30 days'], a:1,

      {t:'New: Unwinding Anxiety', b:'A self-guided, 30-module Sharecare program. Unlike "Take Charge at Work," members don\u2019t have to qualify to participate, and it earns $100 toward the incentive.'},

      {t:'Mental health allyship (suicide awareness) training', b:'An 8-hour, by-request-only training — not listed in the general catalog because of the time commitment involved.'},
      {t:'One Pass — January 2027', b:'A third fitness-discount option (alongside the existing Blue Cross program) giving access to multiple gyms across 5 tiers, plus Walmart+ and Shipt membership perks.'},
      {t:'Co-branded materials for higher ed', b:'Higher ed ABCs can request the Here4TN supervisor newsletter and toolkit with their own institution\u2019s logo added, since employees respond better to familiar branding than to the Partners for Health logo alone.'},
    ],
    quiz:[
      {q:'How many EAP visits will members get starting in 2027?',
       choices:['5','6','8','10'], a:2,
       ex:'The increase from 5 to 8 visits is meant to keep more members supported before they need paid behavioral health visits.'},
      {q:'What new resource for families launches in October 2026?',
       choices:['A genetic testing benefit','An integrated autism care pilot for ages 0\u201317 and caregivers','A separate autism insurance rider','Autism coverage only for dependents under 5'], a:1,
       ex:'The pilot supports the whole family — youth ages 0\u201317, adults, and caregivers — with personalized, clinically guided support.'},

const COLOR_MAP = {
  navy:{main:'var(--navy)', soft:'var(--navy-soft)'},
  teal:{main:'var(--teal)', soft:'var(--teal-soft)'},
  amber:{main:'var(--amber)', soft:'var(--amber-soft)'},
  plum:{main:'var(--plum)', soft:'var(--plum-soft)'},
};

let mode = 'reference';
let activeSection = SECTIONS[0].id;
let searchTerm = '';
let quizPool = 'all';
let quizIdx = 0;
let quizScore = 0;
let quizAnswered = false;
let quizOrder = [];

function buildQuizOrder(){
  let items = [];
  SECTIONS.forEach(s=>{
    if(quizPool !== 'all' && quizPool !== s.id) return;
    s.quiz.forEach(q=> items.push({section:s, q}));
  });
  // light shuffle
  for(let i=items.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [items[i],items[j]] = [items[j],items[i]];
  }
  return items;
}

function renderNav(){
  const list = document.getElementById('nav-list');
  list.innerHTML = SECTIONS.map(s=>{
    const c = COLOR_MAP[s.color].main;
    const active = (mode==='reference' && s.id===activeSection) ? 'active' : '';
    return `<li><button class="nav-btn ${active}" data-id="${s.id}"><span class="dot" style="background:${c}"></span>${s.label}</button></li>`;
  }).join('');
  list.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      mode='reference'; activeSection = btn.dataset.id; searchTerm='';
      document.getElementById('search-input').value='';
      render();
    });
  });
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderReference(){
  const main = document.getElementById('main');
  if(searchTerm.trim().length > 1){
    const term = searchTerm.toLowerCase();
    let matches = [];
    SECTIONS.forEach(s=>{
      s.facts.forEach(f=>{
        if(f.t.toLowerCase().includes(term) || f.b.toLowerCase().includes(term)){
          matches.push({section:s, fact:f});
        }
      });
    });
    main.innerHTML = `
      <div class="top-search-results">
        <h2>${matches.length} result${matches.length===1?'':'s'} for "${escapeHtml(searchTerm)}"</h2>
        ${matches.length===0 ? '<div class="empty-state">No matches. Try a different term, or browse a topic in the sidebar.</div>' : matches.map(m=>{
          const cm = COLOR_MAP[m.section.color];
          return `<div class="card" style="border-left-color:${cm.main}">
            <span class="badge" style="background:${cm.soft};color:${cm.main}">${m.section.label}</span>
            <h3>${m.fact.t}</h3>
            <p>${m.fact.b}</p>
          </div>`;
        }).join('')}
      </div>`;
    return;
  }

  const s = SECTIONS.find(s=>s.id===activeSection);
  const cm = COLOR_MAP[s.color];
  main.innerHTML = `
    <div class="section-header">
      <span class="section-eyebrow" style="color:${cm.main}">Day 1 — reference</span>
      <h2>${s.label}</h2>
      <div class="presenters">Presented by ${s.presenters}</div>
    </div>
    ${s.facts.map(f=>`
      <div class="card" style="border-left-color:${cm.main}">
        <h3>${f.t}</h3>
        <p>${f.b}</p>
      </div>`).join('')}
  `;
}

function renderQuizPicker(){
  const opts = [{id:'all', label:'All topics'}].concat(SECTIONS.map(s=>({id:s.id, label:s.label})));
  return `<div class="quiz-picker">${opts.map(o=>`<button data-id="${o.id}" class="${quizPool===o.id?'active':''}">${o.label}</button>`).join('')}</div>`;
}

function startQuiz(){
  quizOrder = buildQuizOrder();
  quizIdx = 0; quizScore = 0; quizAnswered = false;
  renderQuiz();
}

function renderQuiz(){
  const main = document.getElementById('main');
  const picker = renderQuizPicker();

  if(quizOrder.length === 0){
    main.innerHTML = `
      <div class="section-header"><h2>Quiz</h2></div>
      ${picker}
      <div class="empty-state">No questions in this set yet.</div>`;
    attachQuizPickerEvents();
    return;
  }

  if(quizIdx >= quizOrder.length){
    main.innerHTML = `
      <div class="section-header"><h2>Quiz</h2></div>
      ${picker}
      <div class="quiz-done">
        <h3>Nice work.</h3>
        <p>You scored ${quizScore} out of ${quizOrder.length}.</p>
        <button class="restart-btn" id="quiz-restart">Take it again</button>
      </div>`;
    attachQuizPickerEvents();
    document.getElementById('quiz-restart').addEventListener('click', startQuiz);
    return;
  }

  const item = quizOrder[quizIdx];
  const cm = COLOR_MAP[item.section.color];
  main.innerHTML = `
    <div class="section-header"><h2>Quiz</h2></div>
    ${picker}
    <div class="quiz-card" style="border-left:4px solid ${cm.main}">
      <div class="quiz-progress">Question ${quizIdx+1} of ${quizOrder.length} · <span class="badge" style="background:${cm.soft};color:${cm.main}">${item.section.label}</span></div>
      <div class="quiz-q">${item.q.q}</div>
      <div class="quiz-choices" id="quiz-choices">
        ${item.q.choices.map((c,i)=>`<button class="quiz-choice" data-i="${i}">${c}</button>`).join('')}
      </div>
      <div class="quiz-explain" id="quiz-explain">${item.q.ex}</div>
      <div class="quiz-actions">
        <span class="quiz-score">Score: ${quizScore}/${quizIdx}</span>
        <button class="quiz-next" id="quiz-next" disabled>Next question</button>
      </div>
    </div>`;

  attachQuizPickerEvents();

  const choiceButtons = main.querySelectorAll('.quiz-choice');
  choiceButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(quizAnswered) return;
      quizAnswered = true;
      const chosen = parseInt(btn.dataset.i,10);
      const correct = item.q.a;
      choiceButtons.forEach(b=>{
        b.disabled = true;
        const bi = parseInt(b.dataset.i,10);
        if(bi === correct) b.classList.add('correct');
        else if(bi === chosen) b.classList.add('incorrect');
      });
      if(chosen === correct) quizScore++;
      document.getElementById('quiz-explain').classList.add('show');
      const nextBtn = document.getElementById('quiz-next');
      nextBtn.disabled = false;
      nextBtn.addEventListener('click', ()=>{
        quizIdx++; quizAnswered = false; renderQuiz();
      });
    });
  });
}

function attachQuizPickerEvents(){
  document.querySelectorAll('.quiz-picker button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      quizPool = btn.dataset.id;
      startQuiz();
    });
  });
}

function render(){
  renderNav();
  document.getElementById('btn-mode-reference').classList.toggle('active', mode==='reference');
  document.getElementById('btn-mode-quiz').classList.toggle('active', mode==='quiz');
  document.getElementById('btn-mode-reference').setAttribute('aria-selected', mode==='reference');
  document.getElementById('btn-mode-quiz').setAttribute('aria-selected', mode==='quiz');
  document.getElementById('search-wrap').style.display = mode==='reference' ? 'block' : 'none';

  if(mode==='reference') renderReference();
  else renderQuiz();
}

document.getElementById('btn-mode-reference').addEventListener('click', ()=>{ mode='reference'; render(); });
document.getElementById('btn-mode-quiz').addEventListener('click', ()=>{ mode='quiz'; if(quizOrder.length===0) startQuiz(); else renderQuiz(); });
document.getElementById('search-input').addEventListener('input', (e)=>{ searchTerm = e.target.value; renderReference(); });

render();
</script>
</body>
</html>
